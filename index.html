<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Tracker</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2 class="text-center mb-4">Employee Attendance Tracking</h2>

        <div class="row mb-4 text-center">
            <div class="col-md-6 mb-2">
                <div class="card summary-card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">Total Present</h5>
                        <h2 id="present-count">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-2">
                <div class="card summary-card text-white bg-danger">
                    <div class="card-body">
                        <h5 class="card-title">Total Absent</h5>
                        <h2 id="absent-count">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-person-plus-fill"></i> Add New Employee
            </div>
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-5">
                        <input type="text" id="new-name" class="form-control" placeholder="Enter Employee Name">
                    </div>
                    <div class="col-md-4">
                        <select id="new-dept" class="form-select">
                            <option value="" selected disabled>Select Department</option>
                            <option value="HR">HR</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                            <option value="Security">Security</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button onclick="addEmployee()" class="btn btn-dark w-100">Add Employee</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Employee Name</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th class="action-col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body">
                        </tbody>
                </table>
                
                <p id="empty-msg" class="text-center text-muted mt-3" style="display:none;">No employees found.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
